# ==============================================================================
# SonarQube Project Configuration
# ==============================================================================

# Project Identification
sonar.projectKey=simple-next-app
sonar.projectName=Simple Next App
sonar.projectVersion=1.0

# Source & Test Code
sonar.sources=app,components
sonar.sourceEncoding=UTF-8

# File Encoding & Extensions
sonar.javascript.node.maxspace=4096

# Exclusions (exclude build artifacts, dependencies, and static assets)
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/public/**,\
  **/*.d.ts,\
  **/*.config.js,\
  **/*.config.ts,\
  **/coverage/**,\
  **/build/**,\
  **/dist/**,\
  Dockerfile,\
  docker-compose.yml,\
  Jenkinsfile,\
  deploy.sh

# Optional: Test Coverage Reports (if configured in the future)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
